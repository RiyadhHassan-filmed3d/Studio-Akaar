<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us — Studio Akaar</title>
<meta name="description" content="Contact Studio Akaar, an architecture, interior and landscape design studio in Dhaka, Bangladesh.">
<link rel="icon" type="image/png" href="/images/logo.png">
<script>try{if(sessionStorage.s)document.documentElement.className='skip'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="loader" aria-hidden="true"></div>
<header id="nav"></header>

<div class="pageHead">
  <p class="eyebrow">Have a project in mind?</p>
  <h1>Let's make<br><span>space work.</span></h1>
</div>

<section class="cGrid" style="padding-top:40px">
  <div class="cInfo">
    <p><span class="label">Email</span><br><a href="mailto:info@thestudioakaar.com">info@thestudioakaar.com</a></p>
    <p><span class="label">Phone / WhatsApp</span><br><a href="https://wa.me/8801790568894">+880 1790 568894</a></p>
    <p><span class="label">Studio</span><br>Dhaka, Bangladesh</p>
    <p><span class="label">Prefer to talk first?</span><br><a href="https://calendar.app.google/FAxgQcYUCpT7H9wu6" target="_blank" rel="noopener">Book a meeting ↗</a></p>
    <p><span class="label">Contractor, sub-contractor or supplier?</span><br><a href="mailto:info@thestudioakaar.com?subject=Trade%2FVendor%20Inquiry">Get in touch ↗</a></p>
  </div>

  <form id="inquiryForm" onsubmit="submitInquiry(event)">
    <div class="field"><label for="inqName">Name</label><input type="text" id="inqName" required autocomplete="name"></div>
    <div class="field"><label for="inqPhone">Contact number</label><input type="tel" id="inqPhone" required autocomplete="tel"></div>
    <div class="field"><label for="inqEmail">Email</label><input type="text" id="inqEmail" required autocomplete="email"></div>
    <div class="field">
      <label>Project type</label>
      <div class="radioGrid">
        <label><input type="radio" name="projectType" value="Residencial" required>Residential</label>
        <label><input type="radio" name="projectType" value="Comemrcial">Commercial</label>
        <label><input type="radio" name="projectType" value="Institutional">Institutional</label>
        <label><input type="radio" name="projectType" value="Research">Research</label>
        <label class="wide"><input type="radio" name="projectType" value="__other_option__" id="inqOtherRadio">Other:</label>
      </div>
      <input type="text" id="inqOtherText" class="otherText" placeholder="Type your project type" disabled>
    </div>
    <div class="field"><label for="inqDetails">Your thoughts behind the project</label><textarea id="inqDetails" required placeholder="Location, approximate size, timeline, budget range, anything else that helps us understand the brief."></textarea></div>
    <div style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true"><label for="inqWebsite">Leave this field empty</label><input type="text" id="inqWebsite" tabindex="-1" autocomplete="off"></div>
    <button class="send" type="submit">Send inquiry →</button>
    <p class="fStatus" id="inquiryStatus"></p>
  </form>
</section>
<iframe name="hidden_inquiry_frame" style="display:none"></iframe>

<footer id="foot"></footer>
<a class="wa" href="https://wa.me/8801790568894?text=Hi%20Studio%20Akaar%2C%20I%27d%20like%20to%20talk%20about%20a%20project." target="_blank" rel="noopener">Chat on WhatsApp</a>
<script src="/site.js"></script>
<script>
const GFORM_ACTION='https://docs.google.com/forms/d/e/1FAIpQLSeKLpHWI_oUkzi4JHRqO1qfhVFoyCanGWHHWAxIfl1wo5Sfzw/formResponse';
const E={name:'entry.547253464',phone:'entry.457871208',email:'entry.71544818',projectType:'entry.1824067031',details:'entry.1664469415'};
document.querySelectorAll('input[name="projectType"]').forEach(r=>r.addEventListener('change',()=>{
  const o=document.getElementById('inqOtherText'),on=document.getElementById('inqOtherRadio').checked;
  o.disabled=!on;if(on)o.focus();
}));
function submitInquiry(e){
  e.preventDefault();
  const f=e.target,st=document.getElementById('inquiryStatus'),thanks='Thanks — your inquiry has been sent. We\'ll be in touch shortly.';
  if(document.getElementById('inqWebsite').value.trim()){st.textContent=thanks;f.reset();return}
  const radio=f.querySelector('input[name="projectType"]:checked');
  if(!radio)return;
  const v=id=>document.getElementById(id).value.trim();
  const data={[E.name]:v('inqName'),[E.phone]:v('inqPhone'),[E.email]:v('inqEmail'),[E.details]:v('inqDetails'),[E.projectType]:radio.value};
  if(radio.value==='__other_option__')data[E.projectType+'.other_option_response']=v('inqOtherText');
  const t=document.createElement('form');
  t.action=GFORM_ACTION;t.method='POST';t.target='hidden_inquiry_frame';
  Object.entries(data).forEach(([k,val])=>{const i=document.createElement('input');i.type='hidden';i.name=k;i.value=val;t.appendChild(i)});
  document.body.appendChild(t);t.submit();t.remove();
  st.textContent=thanks;f.reset();document.getElementById('inqOtherText').disabled=true;
}
</script>
</body>
</html>
