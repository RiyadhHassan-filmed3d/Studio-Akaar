<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects — Studio Akaar</title>
<meta name="description" content="Selected architecture, interior and landscape projects by Studio Akaar, Dhaka, Bangladesh.">
<link rel="icon" type="image/png" href="/images/logo.png">
<script>try{if(sessionStorage.s)document.documentElement.className='skip'}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<div id="loader" aria-hidden="true"></div>
<header id="nav"></header>

<div class="pageHead">
  <p class="eyebrow">Selected work</p>
  <h1>The full <span>portfolio.</span></h1>
  <p class="copy" id="note"></p>
</div>
<div class="filters" id="filters"></div>
<section id="grid" style="padding-top:60px"><p style="color:#999;font-size:13px">Loading projects…</p></section>

<footer id="foot"></footer>
<a class="wa" href="https://wa.me/8801790568894?text=Hi%20Studio%20Akaar%2C%20I%27d%20like%20to%20talk%20about%20a%20project." target="_blank" rel="noopener">Chat on WhatsApp</a>

<!-- PROJECT MODAL -->
<div class="ov" id="modal" onclick="if(event.target===this)closeProject()">
  <button class="mNav mPrev" aria-label="Previous project" onclick="stepProject(-1)">←</button>
  <div class="mBox">
    <button class="mClose" aria-label="Close" onclick="closeProject()">✕</button>
    <div>
      <div class="mImg"><img id="mImg" src="" alt=""></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="mInfo">
      <span class="label" id="mCat"></span>
      <h3 id="mTitle"></h3>
      <p id="mDesc"></p>
      <p class="mMeta" id="mMeta"></p>
      <div class="share">
        <button type="button" id="copyBtn" onclick="copyLink()" aria-label="Copy link" title="Copy link">🔗</button>
        <a id="shWa" target="_blank" rel="noopener" aria-label="Share on WhatsApp" title="WhatsApp">W</a>
        <a id="shFb" target="_blank" rel="noopener" aria-label="Share on Facebook" title="Facebook">f</a>
      </div>
      <span class="mCount" id="mCount"></span>
    </div>
  </div>
  <button class="mNav mNext" aria-label="Next project" onclick="stepProject(1)">→</button>
</div>

<script src="/site.js"></script>
<script>
let work=[],filters=['All'],active='All',modalList=[],mi=0,ii=0,shareUrl='',timer=null;

loadProjects().then(w=>{
  work=w;
  w.forEach(p=>{if(!filters.includes(p.category))filters.push(p.category)});
  document.getElementById('note').textContent=w.length?`${w.length} projects across ${filters.length-1} typologies — a growing archive, with more added regularly.`:'No published projects yet.';
  render();
  const h=decodeURIComponent(location.hash.replace(/^#/,'')).toLowerCase();
  const hit=h&&(work.find(p=>p.slug===h)||work.find(p=>p.base===h)||(h.match(/^project-(\d+)$/)&&work.find(p=>p.num===h.match(/^project-(\d+)$/)[1])));
  if(hit)openProject(hit.num);
}).catch(()=>{document.getElementById('grid').innerHTML='<p style="color:#999;font-size:13px">Couldn\'t load the latest projects right now — please check back shortly.</p>'});

function setFilter(f){active=f;render()}
function render(){
  document.getElementById('filters').innerHTML=filters.map(f=>`<button class="${f===active?'active':''}" onclick="setFilter(this.textContent)">${f}</button>`).join('');
  const cats=active==='All'?filters.slice(1):[active];
  document.getElementById('grid').innerHTML=cats.map(cat=>{
    const items=work.filter(p=>p.category===cat);
    if(!items.length)return'';
    return`<div class="catGroup"><div class="catHead reveal"><h3>${cat}</h3><span>${items.length} project${items.length>1?'s':''}</span></div>
    <div class="catRow">${items.map(p=>`<div class="card reveal" tabindex="0" role="button" aria-label="View ${p.title}" onclick="openProject('${p.num}')" onkeydown="if(event.key==='Enter')openProject('${p.num}')">
      <div class="ph"><img src="${p.images[0]}" alt="${p.title} — ${cat.toLowerCase()} by Studio Akaar, Dhaka, Bangladesh" loading="lazy">${p.images.length>1?`<span class="cnt">+${p.images.length-1}</span>`:''}</div>
      <span class="label tag">${cat}</span><h3>${p.title}</h3></div>`).join('')}</div></div>`;
  }).join('');
  observeReveals();
}

function openProject(num){
  modalList=work.filter(x=>active==='All'||x.category===active);
  mi=Math.max(0,modalList.findIndex(w=>w.num===num));ii=0;
  showProject();
  document.getElementById('modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function showProject(){
  const p=modalList[mi];if(!p)return;
  const $=id=>document.getElementById(id);
  $('mImg').src=p.images[ii];$('mImg').alt=p.title;
  $('mCat').textContent=p.category;$('mTitle').textContent=p.title;$('mDesc').textContent=p.desc;
  const meta=[p.loc,p.size].filter(Boolean).join(' · ');
  $('mMeta').textContent=meta;$('mMeta').style.display=meta?'block':'none';
  $('mCount').textContent=(mi+1)+' / '+modalList.length;
  const path=location.pathname;
  shareUrl=location.origin+path+'#'+p.slug;
  history.replaceState(null,'',path+'#'+p.slug);
  $('shWa').href='https://wa.me/?text='+encodeURIComponent(p.title+' — Studio Akaar\n'+shareUrl);
  $('shFb').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent(shareUrl);
  $('thumbs').innerHTML=p.images.length>1?p.images.map((s,i)=>`<img src="${s}" class="${i===ii?'active':''}" onclick="pickImg(${i})" alt="">`).join(''):'';
  autoplay();
}
function autoplay(){clearInterval(timer);const p=modalList[mi];if(p&&p.images.length>1)timer=setInterval(()=>setImg((ii+1)%p.images.length),2100)}
function setImg(i){
  ii=i;const p=modalList[mi];
  document.getElementById('mImg').src=p.images[i];
  document.querySelectorAll('#thumbs img').forEach((t,k)=>t.classList.toggle('active',k===i));
}
function pickImg(i){setImg(i);autoplay()}
function stepProject(d){if(!modalList.length)return;mi=(mi+d+modalList.length)%modalList.length;ii=0;showProject()}
function closeProject(){
  document.getElementById('modal').classList.remove('open');
  document.body.style.overflow='';clearInterval(timer);
  history.replaceState(null,'',location.pathname);
}
function copyLink(){
  const b=document.getElementById('copyBtn'),done=()=>{b.classList.add('copied');setTimeout(()=>b.classList.remove('copied'),1600)};
  if(navigator.clipboard)navigator.clipboard.writeText(shareUrl).then(done).catch(done);
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('modal').classList.contains('open'))return;
  if(e.key==='Escape')closeProject();
  if(e.key==='ArrowRight')stepProject(1);
  if(e.key==='ArrowLeft')stepProject(-1);
});
// swipe between projects on touch
(function(){let x=null;const b=document.querySelector('.mBox');
  b.addEventListener('touchstart',e=>x=e.touches[0].clientX,{passive:true});
  b.addEventListener('touchend',e=>{if(x===null)return;const d=e.changedTouches[0].clientX-x;if(Math.abs(d)>50)stepProject(d<0?1:-1);x=null});
})();
</script>
</body>
</html>
